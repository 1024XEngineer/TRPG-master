name: PR Preview

# CI Preview（issue #200）：PR 开/更新时自动构建 backend+frontend 镜像、部署到
# 预览服务器、在 PR 上评论访问链接；PR 关闭时自动回收。
#
# 顶层不再用 paths 过滤（跟旧版的关键差异）：paths 过滤器是基于"这个事件
# 触发时 PR 的完整 diff"判断的——如果 PR 曾经改过 trpg-backend/** 触发了
# 部署，后续又把这些改动全部撤销、最终 diff 只剩不在监视列表里的文件，
# 后续 synchronize 甚至最终的 closed 事件都不会再匹配 paths，已部署的容器
# 和目录会永久遗留、PR 评论也不会更新成"已回收"（fennoai review 抓到的
# 真问题）。改成 workflow 本身总是对 opened/synchronize/reopened/closed
# 触发，路径判断挪到 job 内部（见 changes job），只门控是否需要真的构建
# 部署；teardown job 不受路径判断影响，但只回收同仓库 PR——fork PR 本来
# 就不会部署，也拿不到仓库 Secrets，关闭时继续尝试 SSH 只会产生误报。
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# 按 PR 号分组只能防止"同一个 PR 的两次 push 互相打架"，防不了"两个不同
# PR 算出同一个端口槽位、同时部署互相抢占同一个宿主机端口"（fennoai review
# 抓到的真问题：docker compose 对同一个端口第二次 up 会直接报
# "port is already allocated" 失败，不是"后部署的把先部署的挤掉"）。改成
# 全仓库级别的单一队列——预览部署这种操作频率本来就不高，排队执行换来
# 正确性，比并发换来的那点速度更值。
concurrency:
  group: pr-preview-deploy-lock
  cancel-in-progress: false

jobs:
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - "trpg-backend/**"
              - "trpg-frontend/**"
              - "trpg-sdk/**"
              - "agent-collaboration-framework/**"
              - "docker-compose.preview.yml"
              - ".github/workflows/pr-preview.yml"

  deploy:
    needs: changes
    # fork 来的 PR 触发 `pull_request` 时，GITHUB_TOKEN 平台级强制降级成只读
    # ——不管这里声明多少 permissions 都没用，push 镜像到 GHCR、在 PR 上评论
    # 这两步必然失败。与其让每个 fork PR 都红一次，不如直接跳过整个 job：
    # 见 issue #200「本期不做 · fork PR 的真实 AI 预览」，这里把范围收紧到
    # "fork PR 完全不跑 Preview"，比"跑起来但降级"更准确地反映了 GitHub
    # 的实际限制。
    if: |
      github.event.action != 'closed' &&
      needs.changes.outputs.relevant == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像 tag 与预览端口
        id: meta
        run: |
          PR=${{ github.event.pull_request.number }}
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # 预览服务器是 PortForward 网关（没有独立公网 IP），不是想开多少
          # 端口就能开多少——只有网关那边显式配置过的端口才能从外部访问。
          # 主分支持久预览固定占用 80→10005，PR 预览不能复用这个入口。
          # 剩余显式配置了 4 对（内部端口 → 外部端口）：
          #   12500→10496  5010→10497  5000→10498  9091→10499
          # 用 PR 号取模从这 4 对里选一对：内部端口是 docker-compose 里
          # frontend 服务实际绑定的宿主机端口，外部端口是评论里给出的访问
          # 链接。这意味着**同时最多 4 个 PR 能有预览**——超过 4 个同时开着
          # 的 PR 会撞进同一个槽位；"部署到预览服务器"那一步会显式检测这种
          # 冲突并直接失败（不是静默覆盖），见下面的说明。真需要更多并发
          # 槽位得找网关加映射。
          INTERNAL_PORTS=(12500 5010 5000 9091)
          EXTERNAL_PORTS=(10496 10497 10498 10499)
          SLOT=$((PR % 4))

          {
            echo "backend_image=ghcr.io/$OWNER_LOWER/trpg-master-backend:pr-$PR"
            echo "frontend_image=ghcr.io/$OWNER_LOWER/trpg-master-frontend:pr-$PR"
            # 同一个 PR 号在生命周期内槽位固定，重新部署（push 新 commit）
            # 不会换端口，评论里的链接不用改。
            echo "internal_port=${INTERNAL_PORTS[$SLOT]}"
            echo "external_port=${EXTERNAL_PORTS[$SLOT]}"
          } >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: 构建并推送 backend 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: trpg-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_image }}
          cache-from: type=gha,scope=preview-backend
          cache-to: type=gha,mode=max,scope=preview-backend

      - name: 构建并推送 frontend 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: trpg-frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.frontend_image }}
          cache-from: type=gha,scope=preview-frontend
          cache-to: type=gha,mode=max,scope=preview-frontend

      - name: 准备 SSH
        env:
          SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          # 固定服务器 host key，不做运行时 ssh-keyscan：运行时 keyscan 拿到
          # 的公钥没有可信来源，网络中的攻击者可以在 runner 和预览服务器之间
          # 冒充服务器、拿到随后发送的 GHCR token 和 DeepSeek key（review
          # 抓到的真问题）。这里写的是我直接从服务器本机 `ssh-keyscan`
          # 出来、经过 SSH 连接亲自核实过指纹的三条 host key，作为 secret
          # 存着（不是密钥，只是拓扑信息，但同样不写进这个公开文件）。
          KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/preview_deploy_key
          chmod 600 ~/.ssh/preview_deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 部署到预览服务器
        env:
          SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
          SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
          SSH_PORT: ${{ secrets.PREVIEW_SSH_PORT }}
          BACKEND_IMAGE: ${{ steps.meta.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.meta.outputs.frontend_image }}
          PORT: ${{ steps.meta.outputs.internal_port }}
          PR: ${{ github.event.pull_request.number }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          # Preview 专用 key，跟本地/生产用的 key 分开管理，方便单独限额/吊销。
          DEEPSEEK_API_KEY: ${{ secrets.PREVIEW_DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.PREVIEW_DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.PREVIEW_DEEPSEEK_MODEL }}
          TURN_PLANNER_MODEL: ${{ vars.PREVIEW_TURN_PLANNER_MODEL }}
          TURN_PLANNER_ROLLOUT_PERCENT: ${{ vars.PREVIEW_TURN_PLANNER_ROLLOUT_PERCENT }}
          QWEN_API_KEY: ${{ secrets.PREVIEW_QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ vars.PREVIEW_QWEN_BASE_URL }}
          QWEN_MODEL: ${{ vars.PREVIEW_QWEN_MODEL }}
          # 当前凭证同时支持 DeepSeek v4 Pro 和 Sufy Gemini 生图；仍按用途
          # 使用两个 Secret 名称，后续可以独立轮换。不要把图片 key 放进前端。
          SUFY_API_KEY: ${{ secrets.PREVIEW_SUFY_API_KEY }}
          SUFY_BASE_URL: ${{ vars.PREVIEW_SUFY_BASE_URL }}
          SUFY_IMAGE_MODEL: ${{ vars.PREVIEW_SUFY_IMAGE_MODEL }}
          DOUBAO_TTS_API_KEY: ${{ secrets.PREVIEW_DOUBAO_TTS_API_KEY }}
          DOUBAO_TTS_VOICES: ${{ secrets.PREVIEW_DOUBAO_TTS_VOICES }}
          DOUBAO_TTS_DEFAULT_VOICE_TYPE: ${{ secrets.PREVIEW_DOUBAO_TTS_DEFAULT_VOICE_TYPE }}
        run: |
          SUFY_BASE_URL="${SUFY_BASE_URL:-https://openai.sufy.com/v1}"
          SUFY_IMAGE_MODEL="${SUFY_IMAGE_MODEL:-google/gemini-3-pro-image}"
          TURN_PLANNER_MODEL="${TURN_PLANNER_MODEL:-deepseek/deepseek-v4-flash}"
          TURN_PLANNER_ROLLOUT_PERCENT="${TURN_PLANNER_ROLLOUT_PERCENT:-0}"
          # DeepSeek 与 Sufy 是同一条角色生图链路的两个阶段：前者整理提示词，
          # 后者生成图片。两套 key 必须成对存在；只配置一套会让预览出现
          # 难以发现的半真实链路，因此在部署前直接失败。
          if [ -n "$DEEPSEEK_API_KEY" ] && [ -n "$SUFY_API_KEY" ]; then
            if [ -z "$DEEPSEEK_BASE_URL" ] || [ -z "$DEEPSEEK_MODEL" ]; then
              echo "::error::已配置 Preview 模型密钥，但缺少 PREVIEW_DEEPSEEK_BASE_URL 或 PREVIEW_DEEPSEEK_MODEL"
              exit 1
            fi
            if [[ ! "$DEEPSEEK_BASE_URL" =~ ^https?://[^/[:space:]]+(/.*)?$ ]]; then
              echo "::error::PREVIEW_DEEPSEEK_BASE_URL 必须是包含主机名的 HTTP(S) 根地址"
              exit 1
            fi
            if [[ "$DEEPSEEK_BASE_URL" == */chat/completions* ]]; then
              echo "::error::PREVIEW_DEEPSEEK_BASE_URL 应填写 API 根地址，不能包含 /chat/completions"
              exit 1
            fi
            if [[ ! "$SUFY_BASE_URL" =~ ^https?://[^/[:space:]]+(/.*)?$ ]]; then
              echo "::error::PREVIEW_SUFY_BASE_URL 必须是包含主机名的 HTTP(S) 根地址"
              exit 1
            fi
            if [[ "$SUFY_BASE_URL" == */images/generations* ]]; then
              echo "::error::PREVIEW_SUFY_BASE_URL 应填写 API 根地址，不能包含 /images/generations"
              exit 1
            fi
            if [ -z "$SUFY_IMAGE_MODEL" ]; then
              echo "::error::已配置 Preview 生图密钥，但 PREVIEW_SUFY_IMAGE_MODEL 为空"
              exit 1
            fi
            HOST_MODEL_PROVIDER=deepseek
            TURN_PLANNER_PROVIDER=deepseek
            CHARACTER_BACKGROUND_PROVIDER=deepseek
            PORTRAIT_PROMPT_PROVIDER=deepseek
            PORTRAIT_IMAGE_PROVIDER=sufy
          else
            if [ -n "$DEEPSEEK_API_KEY" ] || [ -n "$SUFY_API_KEY" ]; then
              echo "::error::Preview 的 DeepSeek 和 Sufy 密钥必须同时配置，不能只启用其中一段"
              exit 1
            fi
            HOST_MODEL_PROVIDER=fake
            TURN_PLANNER_PROVIDER=fake
            TURN_PLANNER_ROLLOUT_PERCENT=0
            CHARACTER_BACKGROUND_PROVIDER=deterministic
            PORTRAIT_PROMPT_PROVIDER=deterministic
            PORTRAIT_IMAGE_PROVIDER=mock
          fi
          QWEN_BASE_URL="${QWEN_BASE_URL:-https://openai.sufy.com/v1}"
          QWEN_MODEL="${QWEN_MODEL:-qwen/qwen3.7-plus}"
          if [ -n "$QWEN_API_KEY" ]; then
            if [ -z "$QWEN_BASE_URL" ] || [ -z "$QWEN_MODEL" ]; then
              echo "::error::已配置 PREVIEW_QWEN_API_KEY，但缺少 PREVIEW_QWEN_BASE_URL 或 PREVIEW_QWEN_MODEL"
              exit 1
            fi
            if [[ ! "$QWEN_BASE_URL" =~ ^https?://[^/[:space:]]+(/.*)?$ ]]; then
              echo "::error::PREVIEW_QWEN_BASE_URL 必须是包含主机名的 HTTP(S) 根地址"
              exit 1
            fi
            if [[ "$QWEN_BASE_URL" == */chat/completions* ]]; then
              echo "::error::PREVIEW_QWEN_BASE_URL 应填写 API 根地址，不能包含 /chat/completions"
              exit 1
            fi
            HOST_MODEL_PROVIDER=qwen
          fi
          if [ -n "$DOUBAO_TTS_API_KEY" ] && [ -n "$DOUBAO_TTS_VOICES" ] && [ -n "$DOUBAO_TTS_DEFAULT_VOICE_TYPE" ]; then
            HOST_SPEECH_PROVIDER=doubao
          else
            HOST_SPEECH_PROVIDER=disabled
          fi
          DEEPSEEK_API_KEY_B64=$(printf '%s' "$DEEPSEEK_API_KEY" | base64 | tr -d '\n')
          DEEPSEEK_BASE_URL_B64=$(printf '%s' "$DEEPSEEK_BASE_URL" | base64 | tr -d '\n')
          DEEPSEEK_MODEL_B64=$(printf '%s' "$DEEPSEEK_MODEL" | base64 | tr -d '\n')
          TURN_PLANNER_MODEL_B64=$(printf '%s' "$TURN_PLANNER_MODEL" | base64 | tr -d '\n')
          if [ -n "$DEEPSEEK_API_KEY_B64" ]; then
            echo "::add-mask::$DEEPSEEK_API_KEY_B64"
          fi
          QWEN_API_KEY_B64=$(printf '%s' "$QWEN_API_KEY" | base64 | tr -d '\n')
          QWEN_BASE_URL_B64=$(printf '%s' "$QWEN_BASE_URL" | base64 | tr -d '\n')
          QWEN_MODEL_B64=$(printf '%s' "$QWEN_MODEL" | base64 | tr -d '\n')
          if [ -n "$QWEN_API_KEY_B64" ]; then
            echo "::add-mask::$QWEN_API_KEY_B64"
          fi
          SUFY_API_KEY_B64=$(printf '%s' "$SUFY_API_KEY" | base64 | tr -d '\n')
          SUFY_BASE_URL_B64=$(printf '%s' "$SUFY_BASE_URL" | base64 | tr -d '\n')
          SUFY_IMAGE_MODEL_B64=$(printf '%s' "$SUFY_IMAGE_MODEL" | base64 | tr -d '\n')
          if [ -n "$SUFY_API_KEY_B64" ]; then
            echo "::add-mask::$SUFY_API_KEY_B64"
          fi
          DOUBAO_TTS_API_KEY_B64=$(printf '%s' "$DOUBAO_TTS_API_KEY" | base64 | tr -d '\n')
          DOUBAO_TTS_VOICES_B64=$(printf '%s' "$DOUBAO_TTS_VOICES" | base64 | tr -d '\n')
          DOUBAO_TTS_DEFAULT_VOICE_TYPE_B64=$(printf '%s' "$DOUBAO_TTS_DEFAULT_VOICE_TYPE" | base64 | tr -d '\n')

          # 注意这里不再 scp 仓库里的 docker-compose.preview.yml——PR 分支
          # 能修改这个文件的内容，而部署账号在 docker 组里（等同宿主机
          # root）。如果直接执行 PR 自己带来的 compose 文件，任何有权限
          # 给这个仓库开同仓库 PR 的人都能在 compose 里加宿主机根目录/
          # docker.sock 挂载或 privileged 容器，从而拿到预览服务器的
          # root（review 抓到的真问题，五条里最严重的一条）。改成部署脚本
          # 只把镜像引用和端口当参数传给服务器上早就放好、PR 完全碰不到的
          # 固定 compose 模板（~/trpg-previews/compose-template/，这份文件
          # 只由有服务器访问权限的人手动维护，不经过 CI）——PR 能决定"用
          # 哪个镜像"，决定不了"以什么权限、挂载什么运行这个镜像"。
          # shellcheck disable=SC2087
          ssh -p "$SSH_PORT" -i ~/.ssh/preview_deploy_key "$SSH_USER@$SSH_HOST" bash -s <<EOF
            set -e
            mkdir -p ~/trpg-previews/pr-$PR

            # 端口槽位冲突检测：这个内部端口如果已经被别的 PR 的容器占着，
            # docker compose up 只会报 "port is already allocated" 失败，
            # 不会像旧注释说的那样"后部署的把先部署的挤掉"（review 抓到的
            # 真问题）。这里显式查出占用者是谁，是自己就放行（重新部署），
            # 是别人就直接失败并给出清楚的原因，不静默、也不驱逐别人的预览。
            OCCUPANT=\$(docker ps --format '{{.Names}}\t{{.Ports}}' | grep ":$PORT->" | awk '{print \$1}' | head -1 || true)
            if [ -n "\$OCCUPANT" ]; then
              OCCUPANT_PR=\$(echo "\$OCCUPANT" | sed -E 's/^pr-([0-9]+)-.*/\1/')
              if [ "\$OCCUPANT_PR" != "$PR" ]; then
                echo "端口槽位（内部 $PORT）当前被 PR #\$OCCUPANT_PR 的预览占用，本次 PR #$PR 部署中止。" >&2
                echo "预览服务器目前只有 4 个 PR 槽位（另有 1 个主分支持久预览槽位），同时开着的 PR 超过 4 个时会撞车——等 PR #\$OCCUPANT_PR 关闭回收后再重试，或者手动清理它的预览。" >&2
                exit 1
              fi
            fi

            cp ~/trpg-previews/compose-template/docker-compose.yml ~/trpg-previews/pr-$PR/docker-compose.yml
            cd ~/trpg-previews/pr-$PR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            export BACKEND_IMAGE="$BACKEND_IMAGE"
            export FRONTEND_IMAGE="$FRONTEND_IMAGE"
            export PREVIEW_PORT="$PORT"
            export HOST_MODEL_PROVIDER="$HOST_MODEL_PROVIDER"
            export CHARACTER_BACKGROUND_PROVIDER="$CHARACTER_BACKGROUND_PROVIDER"
            export DEEPSEEK_API_KEY="\$(printf '%s' '$DEEPSEEK_API_KEY_B64' | base64 -d)"
            export DEEPSEEK_BASE_URL="\$(printf '%s' '$DEEPSEEK_BASE_URL_B64' | base64 -d)"
            export DEEPSEEK_MODEL="\$(printf '%s' '$DEEPSEEK_MODEL_B64' | base64 -d)"
            export TURN_PLANNER_PROVIDER="$TURN_PLANNER_PROVIDER"
            export TURN_PLANNER_API_KEY="\$(printf '%s' '$DEEPSEEK_API_KEY_B64' | base64 -d)"
            export TURN_PLANNER_BASE_URL="\$(printf '%s' '$DEEPSEEK_BASE_URL_B64' | base64 -d)"
            export TURN_PLANNER_MODEL="\$(printf '%s' '$TURN_PLANNER_MODEL_B64' | base64 -d)"
            export TURN_PLANNER_TIMEOUT_SECONDS=5
            export TURN_PLANNER_MAX_ATTEMPTS=2
            export TURN_PLANNER_RETRY_BACKOFF_SECONDS=0.25
            export TURN_PLANNER_ROLLOUT_PERCENT="$TURN_PLANNER_ROLLOUT_PERCENT"
            export QWEN_API_KEY="\$(printf '%s' '$QWEN_API_KEY_B64' | base64 -d)"
            export QWEN_BASE_URL="\$(printf '%s' '$QWEN_BASE_URL_B64' | base64 -d)"
            export QWEN_MODEL="\$(printf '%s' '$QWEN_MODEL_B64' | base64 -d)"
            export CHARACTER_PORTRAIT_ENABLED=true
            export PORTRAIT_PROMPT_PROVIDER="$PORTRAIT_PROMPT_PROVIDER"
            export PORTRAIT_IMAGE_PROVIDER="$PORTRAIT_IMAGE_PROVIDER"
            export SUFY_API_KEY="\$(printf '%s' '$SUFY_API_KEY_B64' | base64 -d)"
            export SUFY_BASE_URL="\$(printf '%s' '$SUFY_BASE_URL_B64' | base64 -d)"
            export SUFY_IMAGE_MODEL="\$(printf '%s' '$SUFY_IMAGE_MODEL_B64' | base64 -d)"
            export PORTRAIT_REFERENCE_IMAGE_PATH=app/assets/portrait-style-reference.png
            export PORTRAIT_GENERATION_TIMEOUT_SECONDS=120
            export HOST_SPEECH_PROVIDER="$HOST_SPEECH_PROVIDER"
            # base64 只负责安全穿过 SSH heredoc，不是加密；GitHub 日志仍由
            # secrets 掩码保护，应用日志则永远不记录这些字段。
            export DOUBAO_TTS_API_KEY="\$(printf '%s' '$DOUBAO_TTS_API_KEY_B64' | base64 -d)"
            export DOUBAO_TTS_VOICES="\$(printf '%s' '$DOUBAO_TTS_VOICES_B64' | base64 -d)"
            export DOUBAO_TTS_DEFAULT_VOICE_TYPE="\$(printf '%s' '$DOUBAO_TTS_DEFAULT_VOICE_TYPE_B64' | base64 -d)"
            CONFIGURED_BACKGROUND_PROVIDER=\$(docker compose config | awk '/CHARACTER_BACKGROUND_PROVIDER:/{print \$2; exit}')
            if [ "\$CONFIGURED_BACKGROUND_PROVIDER" != "$CHARACTER_BACKGROUND_PROVIDER" ]; then
              echo "固定 compose 模板未透传 CHARACTER_BACKGROUND_PROVIDER（期望 $CHARACTER_BACKGROUND_PROVIDER，实际 \${CONFIGURED_BACKGROUND_PROVIDER:-未配置})" >&2
              exit 1
            fi
            CONFIGURED_PLANNER_PROVIDER=\$(docker compose config | awk '/TURN_PLANNER_PROVIDER:/{print \$2; exit}')
            if [ "\$CONFIGURED_PLANNER_PROVIDER" != "$TURN_PLANNER_PROVIDER" ]; then
              echo "固定 compose 模板未透传 TURN_PLANNER_PROVIDER（期望 $TURN_PLANNER_PROVIDER，实际 \${CONFIGURED_PLANNER_PROVIDER:-未配置})" >&2
              exit 1
            fi
            if [ "$HOST_MODEL_PROVIDER" = "qwen" ] && ! docker compose config | grep -q 'QWEN_API_KEY:'; then
              echo "固定 compose 模板未透传 QWEN_API_KEY，无法把主持模型切到千问" >&2
              exit 1
            fi
            docker compose -p pr-$PR pull
            # --wait：等 healthcheck 真的通过再算这一步成功，镜像坏了/
            # entrypoint 启动即崩溃会让这里失败，而不是"容器建起来了"就
            # 当作部署成功、去发一条骗人的"已部署"评论（review 抓到的真
            # 问题）。healthcheck 定义在 compose 模板里。
            docker compose -p pr-$PR up -d --force-recreate --remove-orphans --wait --wait-timeout 90
          EOF

      - name: 在 PR 上评论预览链接
        uses: actions/github-script@v7
        env:
          # 评论里给用户点的必须是外部端口（网关对外映射的那个），不是
          # docker-compose 实际绑定的内部端口——这两个数字不一样，见上面
          # "计算镜像 tag 与预览端口" 步骤的说明。上一步用 --wait 确认过
          # 健康检查通过才会走到这里，失败时 GitHub Actions 默认跳过后续
          # 步骤，不会执行到这条评论。
          EXTERNAL_PORT: ${{ steps.meta.outputs.external_port }}
          SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->';
            const url = `http://${process.env.SSH_HOST}:${process.env.EXTERNAL_PORT}`;
            const body = `${marker}\n### 🔍 CI Preview\n\n预览环境已部署：${url}\n\n> 未配置 Preview 专用 DeepSeek key 时，守秘人回复会是确定性占位文案，不影响其余功能验证。\n\n_最新一次 push 会自动更新这个预览，不需要重新打开链接。_`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  teardown:
    # 不依赖 changes job（那个 job 对 closed 事件根本不跑），也不看
    # paths。同仓库 PR 才可能跑过 deploy，也只有它们的 pull_request 事件
    # 能拿到 PREVIEW_SSH_* Secrets；fork PR 关闭时无需回收，必须在 job 级
    # 直接跳过，否则空 SSH_PORT 会导致 `Bad port ''` 并把已合并 PR 标红。
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: 计算槽位归属（仅用于按 PR 号定位目录，不涉及部署）
        id: meta
        run: |
          echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: 准备 SSH
        env:
          SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/preview_deploy_key
          chmod 600 ~/.ssh/preview_deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 回收预览环境
        env:
          SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
          SSH_USER: ${{ secrets.PREVIEW_SSH_USER }}
          SSH_PORT: ${{ secrets.PREVIEW_SSH_PORT }}
          PR: ${{ steps.meta.outputs.pr }}
        run: |
          # 同上：故意不加引号，$PR 要在 runner 这一侧展开（这里没有
          # secret，纯粹是为了跟部署脚本保持同一套写法）。
          # shellcheck disable=SC2087
          ssh -p "$SSH_PORT" -i ~/.ssh/preview_deploy_key "$SSH_USER@$SSH_HOST" bash -s <<EOF
            set -e
            if [ -d ~/trpg-previews/pr-$PR ]; then
              cd ~/trpg-previews/pr-$PR
              docker compose -p pr-$PR down -v --remove-orphans || true
              cd ~
              rm -rf ~/trpg-previews/pr-$PR
            fi
          EOF

      - name: 在 PR 上更新评论为已回收
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->';
            const body = `${marker}\n### 🔍 CI Preview\n\n预览环境已回收。`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }
