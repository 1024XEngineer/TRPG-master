[project]
name = "agent-collaboration-framework"
version = "0.4.0"
description = "Modular A/B/C contracts and explicit async host orchestration"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13,<3",
]

[project.scripts]
agent-collab-export-schemas = "collaboration_framework.schema_export:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
]


[tool.setuptools.packages.find]
include = ["collaboration_framework*"]
