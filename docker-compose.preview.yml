# CI Preview 用（issue #200）。一份文件两种用法：
#
#   本地直接复现（构建上下文是仓库根目录里的源码）：
#     docker compose -f docker-compose.preview.yml up --build
#
#   服务器上部署（workflow 在部署前已经把镜像 build 好推到 GHCR，只 pull
#   预置好的 BACKEND_IMAGE/FRONTEND_IMAGE，不在服务器上跑 build——见
#   issue #200「决策 2」，不占用生产服务器的算力编译）：
#     BACKEND_IMAGE=ghcr.io/.../trpg-master-backend:pr-123 \
#     FRONTEND_IMAGE=ghcr.io/.../trpg-master-frontend:pr-123 \
#     docker compose -f docker-compose.preview.yml pull
#     docker compose -f docker-compose.preview.yml up -d
#
#   `image:` 和 `build:` 在同一个 service 里可以共存：`up --build` 用
#   build 产物打上 `image:` 里那个 tag；不传 --build 时 `pull`/`up` 只认
#   `image:`，不会碰 build 那部分——这就是两种用法不用拆两份文件的原因。
#
# 数据库故意用容器内 SQLite（不挂宿主机 volume）：预览环境的数据没有留存
# 价值，容器销毁即丢，完全不碰生产/开发用的 Postgres——见 issue #200
# 「决策 5」。
#
# HOST_MODEL_PROVIDER / DEEPSEEK_* 以及角色生图的 PORTRAIT_* / SUFY_* 都从
# 宿主环境变量透传：同仓库 PR 由 workflow 注入真实 key、API 根地址、模型名
# 和 provider；fork PR 因 GitHub Actions 平台限制拿不到 secrets，甚至连部署
# job 都不会跑（见 pr-preview.yml）。下面的默认值只服务于本地复现和旧配置
# 兼容，CI Preview 启用真实链路时必须显式选择对应 provider。
# Base URL 填 API 根地址（如 https://api.example.com/v1），不能填完整的
# /chat/completions 或 /images/generations；客户端会自行追加请求路径。

services:
  backend:
    image: ${BACKEND_IMAGE:-trpg-backend-preview:local}
    build:
      context: .
      dockerfile: trpg-backend/Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite+aiosqlite:///./app.db
      ENABLE_DOCS: "true"
      LOG_LEVEL: INFO
      # 前端是同源反代（Caddy 转发 /api、/ws 到这个服务），浏览器请求走的是
      # 前端自己的 origin，不是这个容器的地址——理论上不需要 CORS；保留一个
      # 宽松值只是兜底（比如直接拿后端端口调试），不依赖它生效。
      CORS_ORIGINS: '["*"]'
      HOST_MODEL_PROVIDER: ${HOST_MODEL_PROVIDER:-fake}
      # 开场超时独立于 Provider HTTP 超时，便于预览环境快速降级到安全模板。
      OPENING_NARRATION_MODE: ${OPENING_NARRATION_MODE:-model}
      OPENING_NARRATION_TIMEOUT_SECONDS: ${OPENING_NARRATION_TIMEOUT_SECONDS:-10}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Preview 默认使用当前新厂商的 v4 Pro；CI 仍可通过 Repository
      # Variables 显式覆盖，通用后端配置不受这里的 Preview 默认值影响。
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.qnaigc.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek/deepseek-v4-pro-202606}
      # 角色生图的提示词与图片生成是两段独立链路：DeepSeek 负责提示词，
      # Sufy Gemini 负责图片。CI 在两套 key 都存在时启用真实链路，否则
      # 通过显式 provider 选择回退到本地可验证的 deterministic/mock。
      CHARACTER_PORTRAIT_ENABLED: ${CHARACTER_PORTRAIT_ENABLED:-true}
      PORTRAIT_PROMPT_PROVIDER: ${PORTRAIT_PROMPT_PROVIDER:-deterministic}
      PORTRAIT_IMAGE_PROVIDER: ${PORTRAIT_IMAGE_PROVIDER:-mock}
      SUFY_API_KEY: ${SUFY_API_KEY:-}
      SUFY_BASE_URL: ${SUFY_BASE_URL:-https://openai.sufy.com/v1}
      SUFY_IMAGE_MODEL: ${SUFY_IMAGE_MODEL:-google/gemini-3-pro-image}
      PORTRAIT_REFERENCE_IMAGE_PATH: ${PORTRAIT_REFERENCE_IMAGE_PATH:-app/assets/portrait-style-reference.png}
      PORTRAIT_GENERATION_TIMEOUT_SECONDS: ${PORTRAIT_GENERATION_TIMEOUT_SECONDS:-120}
      # 没有一整套独立限额凭证时保持 disabled；应用不会回退到浏览器 TTS。
      HOST_SPEECH_PROVIDER: ${HOST_SPEECH_PROVIDER:-disabled}
      DOUBAO_TTS_API_KEY: ${DOUBAO_TTS_API_KEY:-}
      DOUBAO_TTS_RESOURCE_ID: ${DOUBAO_TTS_RESOURCE_ID:-seed-tts-2.0}
      DOUBAO_TTS_VOICES: ${DOUBAO_TTS_VOICES:-[]}
      DOUBAO_TTS_DEFAULT_VOICE_TYPE: ${DOUBAO_TTS_DEFAULT_VOICE_TYPE:-}
    expose:
      - "8000"
    # `docker compose up -d` 只保证容器"被创建/启动"，不代表 entrypoint 里
    # 的迁移/种子加载/uvicorn 真的跑成功了——镜像坏了或启动即崩溃，之前的
    # 写法照样会在几秒后把预览评论成"已部署"（review 抓到的真问题）。
    # python:3.13-slim 镜像没有 curl/wget，用内置 urllib 探活，不用额外装包。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  frontend:
    image: ${FRONTEND_IMAGE:-trpg-frontend-preview:local}
    build:
      context: .
      dockerfile: trpg-frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PREVIEW_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
